<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Défi École — réviser en jouant, du CP au CM2</title>
<meta name="description" content="Des défis de révision pour l'école primaire : CP, CE1, CE2, CM1, CM2. Toutes les matières, des étoiles, des badges et des points à gagner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#1B2440; --ink2:#5D6785; --line:#EADFCB;
  --gold:#F5A623; --green:#22C55E; --red:#EF4444; --violet:#7C4DFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;
  background-image:radial-gradient(#00000008 1.2px, transparent 1.2px);background-size:24px 24px;line-height:1.5;
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none}
a{color:inherit}

/* ---------- TOP ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,247,236,.94);
  backdrop-filter:blur(10px);border-bottom:3px solid var(--ink)}
.logo{display:flex;align-items:center;gap:9px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.03em}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#FFD166;display:grid;place-items:center;font-size:18px;box-shadow:2px 2px 0 var(--gold)}
.logo small{display:block;font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.spacer{flex:1}
.hud{display:flex;gap:7px;align-items:center}
.chip{display:flex;align-items:center;gap:5px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;
  font-weight:800;font-size:13px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.chip small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700}

/* ---------- LAYOUT ---------- */
main{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
.view{display:none}
.view.on{display:block}

/* ---------- ACCUEIL ---------- */
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 18px}
.avatar{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;background:#FFE7BE;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.hello .who{flex:1;min-width:180px}
.hello h1{font-family:'Bricolage Grotesque',sans-serif;font-size:23px;margin:0;letter-spacing:-.03em;line-height:1.1}
.hello p{margin:3px 0 0;color:var(--ink2);font-size:13px;font-weight:600}
.xpbar{height:14px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin-top:10px;box-shadow:2px 2px 0 var(--ink)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#FBBF24,#F59E0B);width:0;transition:width .6s cubic-bezier(.2,.9,.3,1)}

.sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec h2{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;margin:0;letter-spacing:-.02em}
.sec span{font-size:12px;color:var(--ink2);font-weight:600}

.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:3px 3px 0 var(--ink);
  transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.lv:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.lv.on{background:var(--c);color:#fff}
.lv.on .ani{filter:brightness(0) invert(1)}
.lv .ani{font-size:24px;line-height:1.1}
.lv b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:15px;letter-spacing:-.02em}
.lv .st{font-size:10px;font-weight:700;opacity:.75;margin-top:1px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.dc{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:14px;text-align:left;
  box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:6px;min-height:112px}
.dc:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.dc .topline{display:flex;align-items:center;gap:7px}
.dc .mat{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--c);padding:2px 8px;border-radius:99px}
.dc h3{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;margin:0;letter-spacing:-.02em;line-height:1.2}
.dc .stars{margin-top:auto;font-size:16px;letter-spacing:2px;color:#D9CFBF}
.dc .stars b{color:var(--gold);font-weight:400}
.dc .go{position:absolute;right:12px;bottom:11px;font-size:12px;font-weight:800;color:var(--ink2)}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
.bd{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:9px 6px;text-align:center;opacity:.45;filter:grayscale(1)}
.bd.won{opacity:1;filter:none;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);background:#FFFBEF}
.bd .e{font-size:22px;line-height:1.1}
.bd b{display:block;font-size:10px;margin-top:3px;line-height:1.15;letter-spacing:-.01em}

/* ---------- DÉFI ---------- */
.deftop{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.back{background:var(--card);border:2px solid var(--ink);border-radius:11px;padding:7px 12px;font-weight:800;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.pips{display:flex;gap:5px;margin-left:auto}
.pips i{width:26px;height:9px;border-radius:99px;background:#E7DCC8;border:2px solid var(--ink)}
.pips i.ok{background:var(--green)}
.pips i.ko{background:var(--red)}
.pips i.cur{background:var(--gold)}

.qcard{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:22px 20px;box-shadow:5px 5px 0 var(--ink)}
.qmat{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--c);padding:3px 9px;border-radius:99px;margin-bottom:10px}
.qtext{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(19px,3.6vw,26px);line-height:1.25;letter-spacing:-.025em;margin:0 0 18px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:#FFF8E9;border:3px solid var(--ink);border-radius:14px;padding:14px 15px;
  font-size:16px;font-weight:700;text-align:left;transition:transform .1s,background .15s;box-shadow:3px 3px 0 var(--ink)}
.opt:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:#FFF3D9}
.opt .k{width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.opt.ok{background:#DCFCE7;border-color:#15803D}
.opt.ok .k{background:#15803D}
.opt.ko{background:#FEE2E2;border-color:#B91C1C}
.opt.ko .k{background:#B91C1C}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;display:none}
.fb.on{display:block;animation:pop .25s ease}
.fb.good{background:#DCFCE7;border:2px solid #15803D;color:#14532D}
.fb.bad{background:#FEE2E2;border:2px solid #B91C1C;color:#7F1D1D}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.next{margin-top:14px;width:100%;padding:15px;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 5px 0 #0E1428;transition:.12s}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 #0E1428}

/* ---------- FIN ---------- */
.result{text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:28px 20px;box-shadow:5px 5px 0 var(--ink)}
.result .stars{font-size:52px;letter-spacing:6px;color:#E3D8C6;line-height:1}
.result .stars b{color:var(--gold);font-weight:400;display:inline-block;animation:pop .4s ease}
.result h2{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;margin:10px 0 0;letter-spacing:-.03em}
.result p{color:var(--ink2);margin:8px 0 0;font-size:14px;font-weight:600}
.result .xp{font-family:'Bricolage Grotesque',sans-serif;font-size:32px;color:var(--gold);margin-top:12px}
.newbadges{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nb{background:#FFFBEF;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);animation:pop .35s}
.nb .e{font-size:26px}
.nb b{display:block;font-size:11px;margin-top:2px}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.btn2{padding:13px 20px;border-radius:13px;font-weight:800;font-size:14px;border:3px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink)}
.btn2.primary{background:var(--gold);color:#3A2600}

/* confettis */
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
.cf{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

footer{text-align:center;color:#8A93A8;font-size:11.5px;padding:24px 16px 40px}
footer a{font-weight:700;border-bottom:2px solid var(--gold)}

@media(max-width:620px){
  .logo small{display:none}
  .levels{grid-template-columns:repeat(5,1fr);gap:6px}
  .lv{padding:8px 3px;border-radius:13px}
  .lv .ani{font-size:20px}
  .lv b{font-size:13px}
  .lv .st{display:none}
  .grid{grid-template-columns:1fr 1fr;gap:9px}
  .dc{min-height:104px;padding:11px}
  .dc h3{font-size:13px}
  .qcard{padding:16px 14px;border-radius:18px}
  .opt{font-size:15px;padding:13px}
  .hud .chip small{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="logo"><span class="mk">★</span><span>DÉFI ÉCOLE<small>réviser en jouant</small></span></div>
  <div class="spacer"></div>
  <div class="hud">
    <div class="chip" title="Jours d'affilée">🔥 <span id="hudStreak">0</span></div>
    <div class="chip" title="Points d'expérience">⚡ <span id="hudXp">0</span></div>
  </div>
</div>

<main>

<!-- ================= ACCUEIL ================= -->
<section class="view on" id="v-home">
  <div class="hello">
    <div class="avatar" id="avatar">🐣</div>
    <div class="who">
      <h1 id="pseudo">Champion</h1>
      <p id="plvl">Niveau 1 · Petit explorateur</p>
      <div class="xpbar"><i id="xpFill"></i></div>
    </div>
  </div>

  <div class="sec"><h2>Choisis ton niveau</h2><span id="lvlCount"></span></div>
  <div class="levels" id="levels"></div>

  <div class="sec"><h2 id="defiTitle">Défis du CP</h2><span id="defiCount"></span></div>
  <div class="grid" id="defis"></div>

  <div class="sec"><h2>Mes badges</h2><span id="badgeCount"></span></div>
  <div class="badges" id="badges"></div>
</section>

<!-- ================= DÉFI ================= -->
<section class="view" id="v-defi">
  <div class="deftop">
    <button class="back" id="quit">← Quitter</button>
    <div class="pips" id="pips"></div>
  </div>
  <div class="qcard" id="qzone"></div>
</section>

<!-- ================= RÉSULTAT ================= -->
<section class="view" id="v-end">
  <div class="result" id="rez"></div>
</section>

</main>

<footer>
  Défi École — défis de révision CP → CM2, d'après les programmes de l'école primaire.<br>

const DEFIS = [{"id":"cp-fr","nv":"cp","m":"Français","e":"📖","c":"#E0533D","n":"Les sons et les lettres","qs":[["Quel mot contient le son [ch] ?",["chat","table","lune"],0,"« ch » chante comme dans « chat », « cheval », « niche »."],["Combien de syllabes dans « chocolat » ?",["2","3","4"],1,"cho-co-lat : on frappe trois fois dans ses mains."],["Le son [ou] s'écrit avec quelles lettres ?",["ou","on","oi"],0,"ou : comme dans « loup », « poule », « roue »."],["Dans « le chat », le mot « le » est…",["un article","un nom","un verbe"],0,"« le », « la », « les » sont des articles : ils annoncent le nom."],["Quelle phrase est correctement écrite ?",["Le chat dort.","le chat dort","Le chat dort"],0,"Une phrase commence par une majuscule et finit par un point."]]},{"id":"cp-ma","nv":"cp","m":"Maths","e":"🔢","c":"#23618F","n":"Les nombres jusqu'à 20","qs":[["7 + 5 = ?",["11","12","13"],1,"7 + 5 : on part de 7 et on avance de 5 → 12."],["Quel nombre vient juste après 19 ?",["18","20","21"],1,"Après 19, c'est 20 : deux dizaines."],["2 dizaines, c'est…",["2","12","20"],2,"1 dizaine = 10, donc 2 dizaines = 20."],["15 − 6 = ?",["8","9","10"],1,"De 15 on recule de 6 → 9. On peut vérifier : 9 + 6 = 15."],["Range du plus petit au plus grand : 8, 12, 5",["8, 12, 5","5, 8, 12","12, 8, 5"],1,"On compare : 5 < 8 < 12."]]},{"id":"cp-qm","nv":"cp","m":"Questionner le monde","e":"🌱","c":"#31825A","n":"Le temps qui passe","qs":[["Combien de jours y a-t-il dans une semaine ?",["5","7","10"],1,"Lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche : 7 jours."],["Quel mois vient juste après janvier ?",["février","mars","décembre"],0,"Janvier, février, mars, avril…"],["Combien y a-t-il de saisons ?",["2","3","4"],2,"Printemps, été, automne, hiver : 4 saisons."],["Le matin, au réveil, on prend le…",["petit-déjeuner","déjeuner","dîner"],0,"Petit-déjeuner le matin, déjeuner à midi, dîner le soir."],["Quel jour vient après lundi ?",["mercredi","mardi","dimanche"],1,"Lundi puis mardi, dans l'ordre de la semaine."]]},{"id":"cp-em","nv":"cp","m":"EMC","e":"⚖️","c":"#65489B","n":"Vivre ensemble","qs":[["En classe, pour prendre la parole, je…",["lève la main","crie","me lève sans rien dire"],0,"Lever la main, c'est laisser la parole aux autres aussi."],["Un camarade est seul dans la cour. Je…",["l'invite à jouer","ris de lui","l'ignore"],0,"Inviter quelqu'un, c'est le premier geste contre la solitude."],["Une insulte, c'est…",["interdit","permis","drôle"],0,"Les mots peuvent blesser : insulter, c'est déjà une violence."],["Le respect, c'est…",["écouter l'autre","crier plus fort","se moquer"],0,"Respecter, c'est reconnaître que l'autre compte autant que moi."],["J'ai fait mal à quelqu'un sans le vouloir. Je…",["m'excuse","me cache","ris"],0,"S'excuser répare ; se cacher laisse la blessure ouverte."]]},{"id":"cp-an","nv":"cp","m":"Anglais","e":"🇬🇧","c":"#B93A73","n":"Hello ! Les couleurs","qs":[["« red », c'est…",["rouge","bleu","vert"],0,"red = rouge."],["« blue », c'est…",["jaune","bleu","noir"],1,"blue = bleu, comme le ciel."],["Comment dit-on « bonjour » en anglais ?",["goodbye","hello","please"],1,"hello = bonjour ; goodbye = au revoir."],["« green », c'est…",["vert","rose","gris"],0,"green = vert, comme l'herbe."],["« one, two, … » : comment dit-on trois ?",["four","three","two"],1,"one, two, three, four : 1, 2, 3, 4."]]},{"id":"ce1-fr","nv":"ce1","m":"Français","e":"📖","c":"#E0533D","n":"Le verbe et le temps","qs":[["Dans « Le chien aboie », quel est le verbe ?",["le chien","aboie","le"],1,"Le verbe dit ce que fait le sujet : ici, il aboie."],["« Demain, je partirai. » À quel temps est ce verbe ?",["passé","présent","futur"],2,"« Demain » + « partirai » : on parle de ce qui n'est pas encore arrivé."],["Le pluriel de « cheval » est…",["chevals","chevaux","chevaus"],1,"Les mots en -al font souvent -aux : cheval → chevaux."],["Le féminin de « acteur » est…",["acteuse","actrice","acteure"],1,"acteur → actrice, comme directeur → directrice."],["Quelle phrase es const $ = s => document.querySelector(s);
const KEY = "defi_v1";
let st = JSON.parse(localStorage.getItem(KEY) || '{"xp":0,"stars":{},"days":[],"badges":[]}');
if(!st.stars) st.stars = {};
if(!st.days) st.days = [];
if(!st.badges) st.badges = [];
const save = () => localStorage.setItem(KEY, JSON.stringify(st));
const today = () => new Date().toISOString().slice(0,10);

const TITRES = ["Petit explorateur","Apprenti curieux","Chercheur d'étoiles","Malin du jour","Fusée rapide","Champion de la classe","As des défis","Maître des matières","Génie de l'école","Légende du primaire"];
let curNiv = "cp";

/* ---------- helpers ---------- */
function totalStars(){ return DEFIS.reduce((a,d)=> a + (st.stars[d.id]||0), 0); }
function maxStars(){ return DEFIS.length * 3; }
function starsOf(id){ return st.stars[id] || 0; }
function defisOf(nv){ return DEFIS.filter(d => d.nv === nv); }
function starsNiv(nv){ const ds=defisOf(nv); return ds.reduce((a,d)=>a+starsOf(d.id),0) + "/" + ds.length*3; }
function playerLevel(){ return Math.min(10, Math.floor(st.xp / 150) + 1); }
function todayCount(){ return st.days.filter(d => d === today()).length; }

function confetti(n=60){
  const box = $("#conf"); box.innerHTML="";
  const cols=["#F5A623","#22C55E","#3B82F6","#EF4444","#7C4DFF","#FBBF24","#EC4899"];
  for(let i=0;i<n;i++){
    const c=document.createElement("i"); c.className="cf";
    c.style.left = Math.random()*100+"vw";
    c.style.top = "-20px";
    c.style.background = cols[Math.floor(Math.random()*cols.length)];
    c.style.animationDuration = (1.6+Math.random()*1.6)+"s";
    c.style.animationDelay = (Math.random()*0.5)+"s";
    c.style.transform = "rotate("+Math.random()*360+"deg)";
    box.appendChild(c);
  }
  setTimeout(()=>{ box.innerHTML=""; }, 3800);
}

/* ---------- accueil ---------- */
function renderHome(){
  $("#hudXp").textContent = st.xp;
  $("#hudStreak").textContent = st.days.length ? streakLen() : 0;
  const lv = playerLevel();
  $("#plvl").textContent = "Niveau " + lv + " · " + TITRES[lv-1];
  $("#xpFill").style.width = Math.min(100, ((st.xp % 150) / 150) * 100) + "%";
  const tot = totalStars();
  $("#pseudo").textContent = tot >= 40 ? "Champion !" : (tot >= 12 ? "Bien joué !" : "C'est parti !");

  const nl = $("#levels"); nl.innerHTML = "";
  NIVEAUX.forEach(n => {
    const b = document.createElement("button");
    b.className = "lv" + (n.id===curNiv ? " on" : "");
    b.style.setProperty("--c", n.c);
    b.innerHTML = '<div class="ani">'+n.e+'</div><b>'+n.n+'</b><div class="st">'+starsNiv(n.id)+' ★</div>';
    b.onclick = () => { curNiv = n.id; renderHome(); };
    nl.appendChild(b);
  });

  const nv = NIVEAUX.find(x => x.id === curNiv);
  $("#avatar").textContent = nv.e;
  $("#avatar").style.background = nv.c + "22";
  $("#avatar").style.borderColor = nv.c;
  $("#defiTitle").textContent = "Défis du " + nv.n;
  const ds = defisOf(curNiv);
  $("#defiCount").textContent = ds.length + " défis · " + starsNiv(curNiv) + " étoiles";

  const g = $("#defis"); g.innerHTML = "";
  ds.forEach(d => {
    const s = starsOf(d.id);
    const el = document.createElement("button");
    el.className = "dc"; el.style.setProperty("--c", d.c);
    el.innerHTML =
      '<div class="topline"><span class="mat" style="background:'+d.c+'">'+d.m+'</span></div>'+
      '<h3>'+d.n+'</h3>'+
      '<div class="stars">'+ "★".repeat(s) + '<span style="color:#D9CFBF">' + "★".repeat(3-s) + '</span></div>'+
      '<span class="go">' + (s ? "Rejouer" : "Jouer") + ' →</span>';
    el.onclick = () => startDefi(d.id);
    g.appendChild(el);
  });

  const bg = $("#badges"); bg.innerHTML = "";
  BADGES.forEach(b => {
    const won = st.badges.includes(b.id);
    const el = document.createElement("div");
    el.className = "bd" + (won ? " won" : "");
    el.title = b.d;
    el.innerHTML = '<div class="e">'+b.e+'</div><b>'+b.n+'</b>';
    bg.appendChild(el);
  });
  $("#badgeCount").textContent = st.badges.length + " / " + BADGES.length;
}

function streakLen(){
  const s = [...new Set(st.days)].sort();
  if(!s.length) return 0;
  let n = 1, cur = new Date(s[s.length-1]);
  if(s[s.length-1] !== today()){
    const y = new Date(); y.setDate(y.getDate()-1);
    if(s[s.length-1] !== y.toISOString().slice(0,10)) return 0;
  }
  for(let i=s.length-1;i>0;i--){
    const a = new Date(s[i]), b = new Date(s[i-1]);
    if((a-b)/86400000 === 1) n++; else break;
  }
  return n;
}

/* ---------- défi ---------- */
let game = {d:null, i:0, score:0, answered:false, res:[]};

function startDefi(id){
  const d = DEFIS.find(x => x.id === id);
  game = {d, i:0, score:0, answered:false, res:[]};
  show("v-defi"); renderQ();
}
function show(id){
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id===id));
  window.scrollTo({top:0,behavior:"instant"});
}
function renderPips(){
  const p = $("#pips"); p.innerHTML = "";
  game.d.qs.forEach((_,i) => {
    const el = document.createElement("i");
    if(i < game.res.length) el.className = game.res[i] ? "ok" : "ko";
    else if(i === game.i) el.className = "cur";
    p.appendChild(el);
  });
}
function renderQ(){
  if(game.i >= game.d.qs.length) return endDefi();
  renderPips();
  const q = game.d.qs[game.i];
  const zone = $("#qzone");
  zone.innerHTML =
    '<span class="qmat" style="background:'+game.d.c+'">'+game.d.m+' · question '+(game.i+1)+'/'+game.d.qs.length+'</span>'+
    '<h2 class="qtext">'+q[0]+'</h2>'+
    '<div class="opts" id="opts"></div>'+
    '<div class="fb" id="fb"></div>'+
    '<button class="next" id="next" style="display:none">Question suivante →</button>';
  const o = $("#opts");
  q[1].forEach((txt,k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="k">'+"ABC"[k]+'</span><span>'+txt+'</span>';
    b.onclick = () => answer(k);
    o.appendChild(b);
  });
}
function answer(k){
  if(game.answered) return;
  game.answered = true;
  const q = game.d.qs[game.i];
  const good = q[2];
  const opts = [...document.querySelectorAll(".opt")];
  opts.forEach((b,idx) => {
    b.disabled = true;
    if(idx === good) b.classList.add("ok");
    if(idx === k && k !== good) b.classList.add("ko");
  });
  const fb = $("#fb");
  if(k === good){
    game.score++;
    fb.className = "fb good on";
    fb.innerHTML = "✅ <b>Bravo !</b> " + q[3];
  } else {
    fb.className = "fb bad on";
    fb.innerHTML = "❌ <b>Pas tout à fait.</b> " + q[3];
  }
  game.res.push(k === good);
  const nx = $("#next");
  nx.style.display = "block";
  nx.textContent = (game.i === game.d.qs.length-1) ? "Voir mon résultat 🏁" : "Question suivante →";
  nx.onclick = () => { game.i++; game.answered=false; renderQ(); };
  renderPips();
}

function endDefi(){
  const n = game.d.qs.length, sc = game.score;
  const stars = sc === n ? 3 : (sc === n-1 ? 2 : (sc >= Math.ceil(n/2) ? 1 : 0));
  const prev = starsOf(game.d.id);
  if(stars > prev) st.stars[game.d.id] = stars;
  const gained = sc * 10 + (stars === 3 ? 20 : 0);
  st.xp += gained;
  if(!st.days.includes(today())) st.days.push(today());

  const newB = checkBadges();
  save();
  $("#hudXp").textContent = st.xp;
  $("#hudStreak").textContent = streakLen();

  $("#rez").innerHTML =
    '<div class="stars">'+ "★".repeat(stars).replace(/★/g,"<b>★</b>") + "★".repeat(3-stars) +'</div>'+
    '<h2>'+(stars===3?"Parfait !":stars===2?"Très bien !":stars===1?"Bien joué !":"À retenter")+'</h2>'+
    '<p>'+sc+' bonne'+(sc>1?'s':'')+' réponse'+(sc>1?'s':'')+' sur '+n+' · '+game.d.m+'</p>'+
    '<div class="xp">+'+gained+' XP</div>'+
    '<div class="newbadges" id="newb"></div>'+
    '<div class="acts">'+
      '<button class="btn2 primary" id="again">↻ Rejouer ce défi</button>'+
      '<button class="btn2" id="home">🏠 Mes défis</button>'+
    '</div>';

  if(newB.length){
    $("#newb").innerHTML = newB.map(id => {
      const b = BADGES.find(x => x.id === id);
      return '<div class="nb"><div class="e">'+b.e+'</div><b>'+b.n+'</b></div>';
    }).join("");
  }
  if(stars >= 2 || newB.length) confetti(stars===3?90:50);
  $("#again").onclick = () => startDefi(game.d.id);
  $("#home").onclick = () => { renderHome(); show("v-home"); };
  show("v-end");
}

/* ---------- badges ---------- */
function checkBadges(){
  const won = [];
  const add = id => { if(!st.badges.includes(id)){ st.badges.push(id); won.push(id); } };
  const played = Object.keys(st.stars).length;
  const totalD = DEFIS.length;

  if(played >= 1) add("first");
  if(Object.values(st.stars).some(v => v === 3)) { add("three"); add("perfect"); }
  const s = streakLen();
  if(s >= 3) add("streak3");
  if(s >= 7) add("streak7");
  if(played >= 10) add("ten");
  NIVEAUX.forEach(n => {
    const ds = defisOf(n.id);
    if(ds.every(d => starsOf(d.id) === 3)) add(n.id);
  });
  const byMat = m => DEFIS.filter(d => d.m === m && starsOf(d.id) === 3).length;
  if(byMat("Français") >= 3) add("lecture");
  if(byMat("Maths") >= 3) add("calcul");
  if(byMat("Histoire") >= 2) add("hist");
  if(byMat("Sciences") >= 2 || byMat("Questionner le monde") >= 2) add("sci");
  if(byMat("Anglais") >= 2) add("eng");
  if(st.xp >= 500) add("xp500");
  if(st.xp >= 1500) add("xp1500");
  return won;
}

/* ---------- navigation ---------- */
$("#quit").onclick = () => { renderHome(); show("v-home"); };
document.addEventListener("keydown", e => {
  if(!$("#v-defi").classList.contains("on")) return;
  if(["1","2","3"].includes(e.key)){ const o=document.querySelectorAll(".opt")[+e.key-1]; if(o) o.click(); }
  if(e.key === "Enter"){ const n=$("#next"); if(n && n.style.display!=="none") n.click(); }
});

renderHome();
</script>
